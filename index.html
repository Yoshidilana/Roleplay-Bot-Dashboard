    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={`w-5 h-5 ${className}`}></i>;
        };

      const Avatar = ({ user, size = "md" }) => {
            const dims = size === "lg" ? "w-16 h-16 text-xl" : "w-12 h-12 text-base";
            // Sincronizzato con App A: usa solo il campo 'avatar'
            if (user && user.avatar) {
                return <img src={user.avatar} className={`${dims} rounded-2xl object-cover shadow-sm`} alt="" />;
            }
            return (
                <div className={`${dims} rounded-2xl bg-slate-200 flex items-center justify-center font-black text-slate-400 uppercase shadow-inner`}>
                    {user?.nome ? user.nome[0] : "?"}
                </div>
            );
                };

        const ImageCropper = ({ src, onCrop, onCancel }) => {
            const imgRef = React.useRef(null);
            const cropperRef = React.useRef(null);

            React.useEffect(() => {
                if (imgRef.current) {
                    cropperRef.current = new Cropper(imgRef.current, {
                        aspectRatio: 1,
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 1,
                        restore: false,
                        guides: false,
                        center: false,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                }
                return () => cropperRef.current?.destroy();
            }, [src]);

            return (
                <div className="fixed inset-0 bg-slate-900/90 z-[100] flex flex-col items-center justify-center p-4 backdrop-blur-md">
                    <div className="max-w-md w-full bg-white rounded-[2.5rem] overflow-hidden shadow-2xl">
                        <div className="p-6 border-b flex justify-between items-center">
                            <span className="font-black uppercase tracking-tighter text-lg italic">Ritaglia Foto</span>
                            <button onClick={onCancel} className="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-red-500 transition-colors">
                                <Icon name="x" />
                            </button>
                        </div>
                        <div className="aspect-square bg-slate-100 overflow-hidden">
                            <img ref={imgRef} src={src} style={{ display: 'block', maxWidth: '100%' }} />
                        </div>
                        <div className="p-8">
                            <button 
                                onClick={() => {
                                    const canvas = cropperRef.current.getCroppedCanvas({ width: 512, height: 512 });
                                    onCrop(canvas.toDataURL('image/jpeg', 0.9));
                                }}
                                className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all"
                            >
                                Conferma Ritaglio
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

// 1. Creare una Nuova Scuola
const handleCreateSchool = async () => {
    if (!newSchoolName.trim()) return;
    const docId = newSchoolName.trim().replace(/\s+/g, '_');
    try {
        const schoolDocRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', docId);
        await window.FB.setDoc(schoolDocRef, {
            nome: newSchoolName.trim(),
            tipo: 'scuola',
            creatoIl: new Date().toISOString()
        });
        setNewSchoolName('');
    } catch (e) { alert("Errore durante la creazione della scuola"); }
};

// 2. Aggiungere uno Studente Reale alla Scuola Selezionata
const handleAddStudent = async (studentUserId) => {
    if (!studentUserId || !selectedSchool?.id) return;
    
    // Controlla che la classe sia stata effettivamente digitata!
    if (!selectedClass.trim()) {
        alert("Inserisci la classe dello studente (es. 1°A, 3°B, 5°C)!");
        return;
    }

    try {
        const studentDocRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', selectedSchool.id, 'studenti', studentUserId);
        
        await window.FB.setDoc(studentDocRef, { 
            classe: selectedClass.trim().toUpperCase(), // Converte in maiuscolo (es. 1a -> 1A)
            dataIscrizione: new Date().toISOString() 
        });

        // Pulisce il campo classe dopo l'inserimento
        setSelectedClass('');
    } catch (e) { 
        alert("Errore durante l'iscrizione dello studente"); 
    }
};

// 3. Rimuovere uno Studente dalla Scuola Selezionata
const handleRemoveStudent = async (studentUserId) => {
    if (!selectedSchool?.id || !confirm("Rimuovere lo studente dall'istituto?")) return;
    try {
        const studentDocRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', selectedSchool.id, 'studenti', studentUserId);
        await window.FB.deleteDoc(studentDocRef);
    } catch (e) { alert("Errore nella rimozione"); }
};

// 4. Aggiungi NPC (Staff o Sfondo) alla Scuola Selezionata
const handleAddNPC = async (tipoCollection) => {
    if (!newNpcName.trim() || !selectedSchool?.id) return;
    try {
        const cleanedName = newNpcName.trim().toLowerCase().replace(/[^a-z0-9]/g, "_");
        const customDocId = `npc_${Date.now()}_${cleanedName}`;

        // Riferimento al documento con ID personalizzato
        const docRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', selectedSchool.id, tipoCollection, customDocId);
        
        const payload = {
            nome: newNpcName.trim(),
            ruolo: newNpcRole.trim() || (tipoCollection === 'staff' ? 'Docente' : 'Compagno di classe'),
            sesso: npcSesso, // Passa il sesso per le emoji
            creatoIl: new Date()
        };

        // Se stiamo aggiungendo un NPC di Sfondo, aggiungiamo anche la classe!
        if (tipoCollection === 'sfondo' && newNpcClass.trim()) {
            payload.classe = newNpcClass.trim().toUpperCase();
        }

        // Salva con setDoc usando l'ID personalizzato
        await window.FB.setDoc(docRef, payload);

        // Reset dei campi
        setNewNpcName('');
        setNewNpcRole('');
        setNewNpcClass('');
    } catch (e) { 
        console.error("Errore salvataggio NPC:", e);
        alert("Errore nel salvataggio dell'NPC"); 
    }
};

// 5. Elimina NPC dalla Scuola Selezionata
const handleDeleteNPC = async (tipoCollection, id) => {

    } catch (e) { alert("Errore nell'eliminazione"); }
};

            // 2. Caricamento dinamico prodotti quando si apre uno SHOP
            useEffect(() => {
if (selectedItem?.type_modale === 'shop') {
    if (!selectedItem || selectedItem.isNew || !selectedItem.id) return;

                const shopId = String(selectedItem.id || '').trim();

                    alert("Inserisci un ID per l'attività.");
                    return;
                }

                const linkedBuilding = buildings.find(building =>
                    building.shopVincolato === shopId || building.id === selectedItem.luogoFisicoId
                );
                const hasPhysicalLocation = Boolean(
                    selectedItem.luogoFisico ??
                    (selectedItem.luogoFisicoId || linkedBuilding)
                );
                const placeName = String(
                    selectedItem.luogoFisicoNome || linkedBuilding?.nome || shopId
                ).trim();

                if (hasPhysicalLocation && !placeName) {
                    alert("Inserisci il nome del luogo fisico.");
                    return;
                }

                try {
                    const shopRef = window.FB.doc(window.db, 'guilds', guildId, 'shops', shopId);

                        isNew,
                        type_modale,
                        luogoFisicoNome,

                        if (placeData && placeData.shopVincolato !== shopId) {
                            alert(`Esiste già un luogo chiamato "${placeId}" non collegato a questa attività. Scegli un altro nome per il luogo.`);

                        batch.set(shopRef, {
                            ...shopData,
                            id: shopId,
                            luogoFisico: true,

                            ...shopData,
                            id: shopId,
                            luogoFisico: false,
                            luogoFisicoId: '',
                            luogoFisicoNome: ''
                        }, { merge: true });

                            const placeRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', linkedBuilding.id);

                    setSelectedItem(null);

                    console.error("Errore durante il salvataggio dell'attività e del luogo fisico:", e);

            };

            const handleSaveBuilding = async () => {
                const buildingId = String(selectedItem.id || '').trim();
                if (!buildingId || !String(selectedItem.nome || '').trim()) {
                    alert("Inserisci il nome del luogo.");
                    return;
                }
                if (selectedItem.isNew && buildings.some(building => building.id === buildingId)) {
                    alert("Esiste già un luogo con questo nome. Scegli un nome diverso.");
                    return;
                }

                const shopId = selectedItem.tipo === 'negozio' ? (selectedItem.shopVincolato || '') : '';
                const previousBuilding = buildings.find(building => building.id === buildingId);
                const previousShopId = previousBuilding?.shopVincolato || '';

                if (shopId) {
                    const otherLinkedBuilding = buildings.find(building =>
                        building.id !== buildingId && building.shopVincolato === shopId
                    );
                    if (otherLinkedBuilding) {
                        alert(`Il negozio selezionato è già collegato al luogo "${otherLinkedBuilding.nome || otherLinkedBuilding.id}".`);
                        return;
                    }
                }

                try {
                    const batch = window.FB.writeBatch(window.db);
                    const buildingRef = window.FB.doc(window.db, 'guilds', guildId, 'edifici', buildingId);

                    'ippopotamo', 'ippopotami', 'giraffa', 'giraffe', 'zebra', 'zebre', 'fennec', 'fennec', 'procione', 'procioni'
                ];

                if (!specie) return false;

                const normalized = String(specie)
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z\s]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();

                if (!normalized) return false;

                return animalNames.some(animal => normalized.includes(animal));
            };

                if (!targetStr) return { nome: "Nessuno", eta: "N/A", sesso: "N/A", money: 0 };
                
                const cleanId = String(targetStr).replace('<@', '').replace('>', '').replace('!', '').trim();
                const altId = cleanId.toLowerCase().replace(/ /g, "_");
                const u = citizens.find(c => String(c.id) === cleanId || String(c.id) === altId);

                if (u) {
                    const birthday = getMemberBirthday(u);
                    const eta = birthday ? calcolaEta(birthday) : null;
                    
                    let scuola = null;
                    if (!isAnimalSpecies(u.specie)) {
                        if (eta >= 6 && eta <= 10) scuola = `${eta - 5}° Elementare`;
                        else if (eta >= 11 && eta <= 13) scuola = `${eta - 10}° Media`;
                        else if (eta >= 14 && eta <= 18) scuola = `${eta - 13}° Superiore`;
                    }
                    
                    return { 
                        ...u, 
                        nome: `${u.nome} ${u.cognome || ''}`.trim(), 
                        eta, 
                        scuola,
                        sesso: u.sesso || "N/D", 
                        specie: u.specie || "",
                        money: u.money || 0

                }
                
                return { nome: targetStr, eta: "N/A", sesso: "N/A", specie: "", money: 0 };
            };

                if (!memberId) return { schools: [], workplaces: [] };
                const normalizeMemberId = value => String(value || '').replace(/[<@!>]/g, '').trim().toLowerCase().replace(/ /g, "_");
                const id = normalizeMemberId(memberId);
                const matchesId = value => normalizeMemberId(value) === id;

                        const isSchool = building.tipo?.startsWith('scuola') ||

                            building.id.toLowerCase().includes('liceo');
                        return isSchool && (schoolEnrollments[building.id] || []).some(student => matchesId(student.id));
                    })

                        id: building.id,
                        nome: building.nome || building.id,
                        enrollment: (schoolEnrollments[building.id] || []).find(student => matchesId(student.id))
                    }));

                    .filter(shop => matchesId(shop.owner_id) || (shop.dipendenti || []).some(employeeId => matchesId(employeeId)))

                if (match) return `${match[1].padStart(2, '0')}/${match[2].padStart(2, '0')}/${match[3]}`;

 const queryCerca = (jobStaffSearch || '').trim().toLowerCase();

// Funzione per calcolare l'età esatta
function calcolaEta(dataStr) {
    if (!dataStr) return null;
    
    let giorno, mese, anno;

    if (typeof dataStr === 'string' && dataStr.includes('/')) {
        const parti = dataStr.split('/');
        giorno = parseInt(parti[0], 10);
        mese = parseInt(parti[1], 10) - 1;
        anno = parseInt(parti[2], 10);
    } else {
        const d = new Date(dataStr);
        if (isNaN(d.getTime())) return parseInt(dataStr) || null;
        giorno = d.getDate();
        mese = d.getMonth();
        anno = d.getFullYear();
    }

    const oggi = new Date();
    let eta = oggi.getFullYear() - anno;
    const m = oggi.getMonth() - mese;
    if (m < 0 || (m === 0 && oggi.getDate() < giorno)) eta--;
    return eta;
}

// Restituisce solo i cittadini idonei per l'edificio scolastico selezionato
function getCandidatiIdonei(school, allUsers) {
    if (!school) return [];
    
    // Legge il tipo dal documento Firestore (es. "scuola_superiori", "scuola_medie")
    const tipo = (school.tipo || "").toLowerCase();

    return Object.values(allUsers || {}).filter(u => {
        const valData = u.Nascita || u.nascita || u.dataNascita || u.compleanno || u.eta;
        const eta = calcolaEta(valData);

        if (eta === null) return false;
        if (u && u.specie && /\b(?:animale|pet|can(?:e|i)|gatt(?:o|i)|lup(?:o|i)|ors(?:o|i)|volp(?:e|i)|conigl(?:io|i)|leon(?:e|i)|tig(?:re|ri)|pum(?:a|e)|leopard(?:o|i)|giaguar(?:o|i)|scimmi(?:a|e)|gorill(?:a|e)|babbuin(?:o|i)|cerv(?:o|i)|ren(?:o|i|na|ne)|cavall(?:o|i)|mucc(?:h|he)|pecor(?:a|e)|maial(?:e|i)|capr(?:a|e)|gallin(?:a|e)|poll(?:o|i)|anat(?:ra|re)|oc(?:a|he)|paper(?:a|i)|cign(?:o|i)|falc(?:o|i)|aquil(?:a|e)|guf(?:o|i)|corv(?:o|i)|piccion(?:e|i)|passer(?:o|i)|canarin(?:o|i)|cricet(?:o|i)|top(?:o|i)|ratt(?:o|i)|furett(?:o|i)|tartarug(?:a|he)|lucertol(?:a|e)|serpent(?:e|i)|ran(?:a|e)|rosp(?:o|i)|coccodrill(?:o|i)|alligat(?:ore|ori)|delfin(?:o|i)|balen(?:a|e)|squal(?:o|i)|pesc(?:e|i)|medus(?:a|e)|polp(?:o|i)|granch(?:io|i)|gamber(?:o|i)|cavallucci? marini?|pinguin(?:o|i)|pand(?:a|e)|koal(?:a|e)|scoiattol(?:o|i)|elefant(?:e|i)|rinoceront(?:e|i)|ippopotam(?:o|i)|giraff(?:a|e)|zebr(?:a|e)|fennec|procion(?:e|i))\b/i.test(String(u.specie))) {
            return false;
        }

        // Filtro fasce d'età basato sul tipo di scuola di Firestore
        if (tipo === 'scuola_asilo') return eta >= 3 && eta <= 5;
        if (tipo === 'scuola_elementari') return eta >= 6 && eta <= 10;
        if (tipo === 'scuola_medie') return eta >= 11 && eta <= 13;
        if (tipo === 'scuola_superiori' || tipo === 'scuola') return eta >= 14 && eta <= 19;
        
        // Fallback generico per scuole
        return eta >= 3 && eta <= 19;
    });
}

// Verifica se un utente è un essere umano e se è disponibile/disoccupato per un lavoro
function eUmanoEDisponibile(u) {
    if (!u) return false;

    // 1. FILTRO ANIMALI (stessa regex usata per le scuole)
    if (u.specie && /\b(?:animale|pet|can(?:e|i)|gatt(?:o|i)|lup(?:o|i)|ors(?:o|i)|volp(?:e|i)|conigl(?:io|i)|leon(?:e|i)|tig(?:re|ri)|pum(?:a|e)|leopard(?:o|i)|giaguar(?:o|i)|scimmi(?:a|e)|gorill(?:a|e)|babbuin(?:o|i)|cerv(?:o|i)|ren(?:o|i|na|ne)|cavall(?:o|i)|mucc(?:h|he)|pecor(?:a|e)|maial(?:e|i)|capr(?:a|e)|gallin(?:a|e)|poll(?:o|i)|anat(?:ra|re)|oc(?:a|he)|paper(?:a|i)|cign(?:o|i)|falc(?:o|i)|aquil(?:a|e)|guf(?:o|i)|corv(?:o|i)|piccion(?:e|i)|passer(?:o|i)|canarin(?:o|i)|cricet(?:o|i)|top(?:o|i)|ratt(?:o|i)|furett(?:o|i)|tartarug(?:a|he)|lucertol(?:a|e)|serpent(?:e|i)|ran(?:a|e)|rosp(?:o|i)|coccodrill(?:o|i)|alligat(?:ore|ori)|delfin(?:o|i)|balen(?:a|e)|squal(?:o|i)|pesc(?:e|i)|medus(?:a|e)|polp(?:o|i)|granch(?:io|i)|gamber(?:o|i)|cavallucci? marini?|pinguin(?:o|i)|pand(?:a|e)|koal(?:a|e)|scoiattol(?:o|i)|elefant(?:e|i)|rinoceront(?:e|i)|ippopotam(?:o|i)|giraff(?:a|e)|zebr(?:a|e)|fennec|procion(?:e|i))\b/i.test(String(u.specie))) {
        return false;
    }

    // 2. FILTRO LAVORO / DISOCCUPAZIONE
    const lavoro = String(u.lavoro || u.job || '').trim().toLowerCase();
    
    // Lista di valori che indicano la mancanza di un impiego specifico
    const statoDisoccupato = [
        '', 'nessuno', 'nessun lavoro', 
        'disoccupato', 'disoccupata', 
        'cittadino', 'cittadina'
    ];

    return statoDisoccupato.includes(lavoro);
}
